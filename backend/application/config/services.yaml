services:
    _defaults:
        autowire: true
        autoconfigure: true

    ### Framework ###

    App\Framework\Application\Command\CommandBus: '@App\Framework\Infrastructure\Symfony\Messenger\SymfonyCommandBus'

    App\Framework\Application\Command\Exception\ExceptionTransformer: ~

    App\Framework\Application\Query\Exception\ExceptionTransformer: ~

    App\Framework\Application\Query\QueryBus: '@App\Framework\Infrastructure\Symfony\Messenger\SymfonyQueryBus'

    App\Framework\Domain\Event\DomainEventBus: '@App\Framework\Infrastructure\Symfony\Messenger\SymfonyDomainEventBus'

    App\Framework\Domain\Model\Event\AggregateEventsBus: '@App\Framework\Infrastructure\Symfony\Messenger\SymfonyAggregateEventBus'

    App\Framework\Domain\Repository\TransactionBoundary: '@App\Framework\Infrastructure\Doctrine\DbalTransactionBoundary'

    App\Framework\Infrastructure\Doctrine\DbalTransactionBoundary: ~

    App\Framework\Infrastructure\Symfony\CorrelationId\SymfonyCorrelationIdProvider: ~

    App\Framework\Infrastructure\Symfony\Messenger\SymfonyAggregateEventBus:
        arguments:
            $aggregateEventBus: '@aggregate_event.bus'

    App\Framework\Infrastructure\Symfony\Messenger\SymfonyCommandBus:
        arguments:
            $commandBus: '@command.bus'

    App\Framework\Infrastructure\Symfony\Messenger\SymfonyDomainEventBus:
        arguments:
            $domainEventBus: '@domain_event.bus'

    App\Framework\Infrastructure\Symfony\Messenger\SymfonyQueryBus:
        arguments:
            $queryBus: '@query.bus'

    App\Framework\Infrastructure\Symfony\Router\SymfonyInstanceProvider:
        arguments:
            $baseBackendUrl: '%env(BASE_BACKEND_URL)%'

    App\Framework\Infrastructure\Symfony\Validation\SymfonyValidator: ~

    App\Framework\UserInterface\ApiProblem\ApiProblemExceptionListener: ~

    App\Framework\UserInterface\ApiProblem\DevExceptionTransformer: ~

    App\Framework\UserInterface\ApiProblem\ExceptionTransformer: '@App\Framework\UserInterface\ApiProblem\DevExceptionTransformer'

    App\Framework\UserInterface\ApiProblem\ProblemDetail\InstanceProvider: '@App\Framework\Infrastructure\Symfony\Router\SymfonyInstanceProvider'

    App\Framework\UserInterface\CorrelationId\CorrelationIdProvider: '@App\Framework\Infrastructure\Symfony\CorrelationId\SymfonyCorrelationIdProvider'

    App\Framework\UserInterface\Hal\HalSerializer:
        arguments:
            $baseUrl: '%env(BASE_BACKEND_URL)%'

    App\Framework\UserInterface\Validation\Validator: '@App\Framework\Infrastructure\Symfony\Validation\SymfonyValidator'

    Symfony\Component\Serializer\NameConverter\NameConverterInterface: '@serializer.name_converter.metadata_aware'

imports:
    - { resource: services/**/services/*.yaml }

when@prod:
    services:
        App\Framework\UserInterface\ApiProblem\ExceptionTransformer: '@App\Framework\UserInterface\ApiProblem\ProdExceptionTransformer'

        App\Framework\UserInterface\ApiProblem\ProdExceptionTransformer: ~
