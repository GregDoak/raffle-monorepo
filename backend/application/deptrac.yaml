deptrac:
    cache_file: var/static/deptrac/deptrac.cache
    paths:
        - ./src
    layers:
        -   name: Foundation
            collectors:
                -   type: directory
                    value: src/Foundation/
        -   name: FrameworkApplicationCommand
            collectors:
                -   type: directory
                    value: src/Framework/Application/Command
        -   name: FrameworkApplicationQuery
            collectors:
                -   type: directory
                    value: src/Framework/Application/Query
        -   name: FrameworkDomain
            collectors:
                -   type: directory
                    value: src/Framework/Domain/
        -   name: FrameworkInfrastructure
            collectors:
                -   type: directory
                    value: src/Framework/Infrastructure/
        -   name: FrameworkUserInterface
            collectors:
                -   type: directory
                    value: src/Framework/UserInterface/
        -   name: RaffleDemoAccountApplication
            collectors:
                -   type: directory
                    value: src/RaffleDemo/Account/Application/
        -   name: RaffleDemoAccountDomain
            collectors:
                -   type: directory
                    value: src/RaffleDemo/Account/Domain/
        -   name: RaffleDemoAccountInfrastructure
            collectors:
                -   type: directory
                    value: src/RaffleDemo/Account/Infrastructure/
        -   name: RaffleDemoAccountUserInterface
            collectors:
                -   type: directory
                    value: src/RaffleDemo/Account/UserInterface/
        -   name: Vendor
            collectors:
                -   type: composer
                    composerPath: composer.json
                    composerLockPath: composer.lock
                    packages:
                        - bref/symfony-bridge
                        - doctrine/dbal
                        - doctrine/migrations
                        - nelmio/api-doc-bundle
                        - psr/log
                        - symfony/event-dispatcher
                        - symfony/http-foundation
                        - symfony/http-kernel
                        - symfony/messenger
                        - symfony/routing
                        - symfony/security-core
                        - symfony/serializer
                        - symfony/validator
                        - symfony/uid
                        - zircote/swagger-php
    ruleset:
        Foundation:
            - Vendor
        FrameworkApplicationCommand:
            - Foundation
            - FrameworkDomain
        FrameworkApplicationQuery:
            - Foundation
            - FrameworkDomain
        FrameworkDomain:
            - Foundation
        FrameworkInfrastructure:
            - Foundation
            - FrameworkApplicationCommand
            - FrameworkApplicationQuery
            - FrameworkDomain
            - FrameworkUserInterface
            - Vendor
        FrameworkUserInterface:
            - Foundation
            - FrameworkApplicationCommand
            - FrameworkApplicationQuery
            - Vendor
        RaffleDemoAccountApplication:
            - Foundation
            - FrameworkApplicationCommand
            - FrameworkDomain
            - RaffleDemoAccountDomain
        RaffleDemoAccountDomain:
            - Foundation
            - FrameworkDomain
        RaffleDemoAccountInfrastructure:
            - Foundation
            - FrameworkDomain
            - FrameworkInfrastructure
            - RaffleDemoAccountDomain
            - Vendor
        RaffleDemoAccountUserInterface:
            - Foundation
            - FrameworkApplicationCommand
            - FrameworkApplicationQuery
            - FrameworkUserInterface
            - RaffleDemoAccountApplication
            - Vendor

